# Development Docker Compose — starts only PostgreSQL.
# Run the app services locally with `pnpm dev` and `python run.py`.
#
# Usage:
#   docker-compose -f docker-compose.dev.yml up -d
#   docker-compose -f docker-compose.dev.yml down

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sprite_generator
      POSTGRES_USER: sprite
      POSTGRES_PASSWORD: sprite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/src/infra/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sprite -d sprite_generator"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
